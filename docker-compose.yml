services:
  tailscaled:
    image: ltlei/tailscale-awg:latest
    container_name: tailscaled
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    # Enable these only when advertising this TUN container as an exit node
    # or subnet router; approve the advertised routes in the control plane.
    # sysctls:
    #   net.ipv4.ip_forward: "1"
    #   net.ipv6.conf.all.forwarding: "1"
    restart: unless-stopped
    stdin_open: true
    tty: true
    volumes:
      - ./tailscale-state:/var/lib/tailscale
    # Keep the image's containerboot command: it interprets TS_* variables.
    # v1.102.4+ preserves AWG when containerboot re-runs tailscale up.
    environment:
      TS_STATE_DIR: /var/lib/tailscale
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
      TS_USERSPACE: "false"
      TS_AUTH_ONCE: "true"
      # TS_AUTHKEY: ${TS_AUTHKEY}
      # TS_EXTRA_ARGS: --login-server=https://your-headscale-domain --accept-routes
