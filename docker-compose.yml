services:
  tailscaled:
    image: ltlei/tailscale-awg:latest
    container_name: tailscaled
    network_mode: "host"
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    restart: unless-stopped
    stdin_open: true
    tty: true
    volumes:
      - ./tailscale-state:/var/lib/tailscale
    # Keep the image's containerboot command: it interprets TS_* variables.
    # v1.102.4+ preserves AWG when containerboot re-runs tailscale up.
    environment:
      TS_STATE_DIR: /var/lib/tailscale
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
      TS_USERSPACE: "false"
      TS_AUTH_ONCE: "true"
      # TS_AUTHKEY: ${TS_AUTHKEY}
      # TS_EXTRA_ARGS: --login-server=https://your-headscale-domain --accept-routes
